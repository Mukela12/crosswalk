spring.application.name=crosswalk-api
server.port=${PORT:8080}
server.forward-headers-strategy=native
spring.threads.virtual.enabled=true

# Runtime connection: the least-privilege role, subject to row-level security.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crosswalk}
spring.datasource.username=crosswalk_app
spring.datasource.password=${APP_DB_PASSWORD:local-app-password}
spring.datasource.hikari.maximum-pool-size=10

# Migrations and the demo seeder use the schema owner.
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/crosswalk}
spring.flyway.user=${DB_OWNER_USER:${USER:postgres}}
spring.flyway.password=${DB_OWNER_PASSWORD:}
spring.flyway.placeholders.appPassword=${APP_DB_PASSWORD:local-app-password}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
server.tomcat.max-swallow-size=4MB

server.servlet.session.cookie.name=cw_session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=8h

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=healthz
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

crosswalk.edge-secret=${EDGE_SECRET:}
crosswalk.demo.enabled=${DEMO_ENABLED:true}
crosswalk.demo.password=${DEMO_PASSWORD:crosswalk-demo}
crosswalk.demo.reset-cron=${DEMO_RESET_CRON:0 0 */6 * * *}
