name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  attack-suite:
    name: API build and attack tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crosswalk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/crosswalk_test
      DB_OWNER_USER: postgres
      DB_OWNER_PASSWORD: postgres
      APP_DB_PASSWORD: ci-app-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run the attack suite against Postgres with RLS
        run: ./mvnw -B -ntp verify
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: api/target/surefire-reports
          retention-days: 14

  front-end:
    name: Front end and Worker syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse every module
        run: for f in web/js/*.js web/js/views/*.js edge/src/*.js; do node --check "$f"; done
      - name: No innerHTML, eval or inline handlers
        run: |
          if grep -rnE 'innerHTML|outerHTML|insertAdjacentHTML|eval\(|new Function|document\.write' web/js edge/src; then
            echo "::error::Unsafe DOM or eval API found"; exit 1
          fi
